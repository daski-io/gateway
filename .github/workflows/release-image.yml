name: Release image
on:
  push:
    branches: [develop, 'hotfix/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: release-image-${{ github.sha }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/release-image.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail the develop image on fixable MEDIUM+ advisories before it is
      # attested and recorded as a release candidate: the coordinator promotes
      # only images whose exact-SHA run succeeded. buildx pushes without
      # loading the image into the runner's daemon, so the exact pushed digest
      # is pulled back through the runner's ghcr login and scanned over the
      # Docker socket. Scanner pinned like the provider's.
      - name: Pull the pushed image by digest
        run: docker pull "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Scan the pushed image
        continue-on-error: false
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed
          "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Extract the capability manifest from the exact published image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RELEASE_IMAGE"
          container="$(docker create "$RELEASE_IMAGE")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/dist/release-capabilities.json" release-capabilities.json
      - name: Record exact OCI platform descriptors
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/release-oci.mjs
      - name: Record immutable image and embedded capabilities
        env:
          DASKI_OCI_METADATA_FILE: release-oci.json
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: node scripts/release-image.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.sha }}
          path: |
            release-image.json
            release-capabilities.json
            release-oci.json
          retention-days: 90
