name: CI

# One validate run per commit:
#   - push covers develop, sandbox (after a release merge), main (after a
#     promotion) and hotfix/** (emergency fixes branched from main)
#   - pull_request covers feature branches through their PR into develop
# The develop -> sandbox release PR deliberately gets no pull_request run: its
# head commit is the develop head, which already carries the completed
# push-run "validate" check, and that is the check the release gate reads
# from the PR's statusCheckRollup — the gate runs right after creating the
# PR without waiting for fresh checks, so the check must already exist and
# be green. The same holds for the sandbox -> main promotion PR: its head is
# the sandbox release commit, which carries its own push run. That run is why
# sandbox is listed under push: the release merge is a new commit, and
# production promotion reads its push run as the proof for that exact commit.
# Listing a release branch under pull_request only duplicates the run: with
# main listed there, every develop push while a release PR was open validated
# twice (seen on PR #14).
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - sandbox
      - main
      - "hotfix/**"

# Cancel superseded runs on the same ref (rapid develop pushes, PR
# synchronize). Cancellation only ever hits runs for outdated commits, so a
# PR head never carries a cancelled check in its rollup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # "validate" is the check name the release gate requires — keep it stable.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: daski_gateway_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daski_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL_TEST: postgresql://postgres:password@127.0.0.1:5433/daski_gateway_test

    steps:
      # Full history: the prior-runtime step below checks out and builds the
      # base commit.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind candidate source
        run: echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Full-repo typecheck including test/. The build tsconfig is
      # src-only and vitest transpiles without checking, so without this
      # step the mock layer has no type gate at all — 15 type errors
      # accumulated in test helpers across two release days before the
      # 2026-08-01 post-mortem noticed (mock drift from real interfaces
      # is this stack's historically most expensive bug class).
      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Test
        run: npm test

      # test/wire-fixtures/ is generated from the real builders by
      # test/wireFixtures.test.ts and vendored verbatim by daski-test,
      # daski-buyer and daski-provider (test/fixtures/gateway-wire/); the
      # coordinator compares those copies byte for byte. The test itself
      # compares parsed JSON, so regenerate here and require the committed
      # directory to be identical and complete.
      - name: Wire fixtures are freshly generated and committed
        run: |
          UPDATE_WIRE_FIXTURES=1 NODE_ENV=test npx vitest run test/wireFixtures.test.ts
          git diff --exit-code -- test/wire-fixtures
          untracked="$(git ls-files --others --exclude-standard -- test/wire-fixtures)"
          if [ -n "$untracked" ]; then
            echo "uncommitted wire fixtures: $untracked"
            exit 1
          fi

      - name: Boot actual Dockerfile image on representative existing state
        run: |
          docker build --build-arg SOURCE_SHA="$CANDIDATE_SHA" -t gateway-startup:$CANDIDATE_SHA .
          npm run test:startup -- --image gateway-startup:$CANDIDATE_SHA --output .tmp/gateway-startup-proof.json
          npm run test:startup -- --fixture post-epoch --image gateway-startup:$CANDIDATE_SHA --output .tmp/gateway-startup-proof-post-epoch.json

      # A rollback, and the old instance during a deploy, run the previous
      # runtime on the schema this candidate migrated. When the change touches
      # a migration, build the base commit (the pull request base, else the
      # head this push replaced, else the parent) and prove its runtime still
      # boots there.
      - name: Prior runtime on expanded schema (migration changes)
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [ -z "$base" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          base="${base:-$(git rev-parse HEAD^)}"
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^src/db/migrations/' <<< "$changed"; then
            bash scripts/reliability/prior-runtime.sh "$base" .tmp/gateway-prior-runtime-evidence.json
          fi

      - name: Archive qualified compiled runtime
        run: tar -czf gateway-runtime-dist.tar.gz dist

      - name: Preserve candidate build and startup identity
        uses: actions/upload-artifact@v4
        with:
          name: gateway-runtime-proof-${{ env.CANDIDATE_SHA }}
          path: |
            gateway-runtime-dist.tar.gz
            dist/build-identity.json
            .tmp/gateway-startup-proof.json
            .tmp/gateway-startup-proof-post-epoch.json
            .tmp/gateway-prior-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30

      # A high-severity advisory fails the build; the registry being
      # unreachable does not. npm exits 1 for both, so the transport failure
      # is told apart by its message and retried with backoff (2026-09-03: a
      # 503 from the audit endpoint held a release pull request red for 17
      # hours over 0 vulnerabilities).
      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npm audit --audit-level=high 2>&1 | tee audit.log; then exit 0; fi
            if ! grep -qiE "audit endpoint returned an error|npm (warn|error) audit [0-9]{3} |ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN" audit.log; then
              echo "npm audit reported findings"
              exit 1
            fi
            echo "npm audit endpoint unavailable (attempt $attempt of 4); retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "npm audit endpoint unavailable after 4 attempts"
          exit 1

  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release hand-off trailers
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          node scripts/check-release-trailers.mjs --range "$range"
