name: CI

# One validate run per commit:
#   - push covers develop (and main after a release merge)
#   - pull_request covers feature branches through their PR into develop
# The develop -> main release PR deliberately gets no pull_request run: its
# head commit is the develop head, which already carries the completed
# push-run "validate" check, and that is the check the release gate reads
# from the PR's statusCheckRollup — the gate runs right after creating the
# PR without waiting for fresh checks, so the check must already exist and
# be green. Listing main under pull_request only duplicated it: every
# develop push while a release PR was open validated twice (seen on PR #14).
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - main

# Cancel superseded runs on the same ref (rapid develop pushes, PR
# synchronize). Cancellation only ever hits runs for outdated commits, so a
# PR head never carries a cancelled check in its rollup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # "validate" is the check name the release gate requires — keep it stable.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: daski_gateway_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daski_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL_TEST: postgresql://postgres:password@127.0.0.1:5433/daski_gateway_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Full-repo typecheck including test/. The build tsconfig is
      # src-only and vitest transpiles without checking, so without this
      # step the mock layer has no type gate at all — 15 type errors
      # accumulated in test helpers across two release days before the
      # 2026-08-01 post-mortem noticed (mock drift from real interfaces
      # is this stack's historically most expensive bug class).
      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Test
        run: npm test

      # A high-severity advisory fails the build; the registry being
      # unreachable does not. npm exits 1 for both, so the transport failure
      # is told apart by its message and retried with backoff (2026-09-03: a
      # 503 from the audit endpoint held a release pull request red for 17
      # hours over 0 vulnerabilities).
      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npm audit --audit-level=high 2>&1 | tee audit.log; then exit 0; fi
            if ! grep -qiE "audit endpoint returned an error|npm (warn|error) audit [0-9]{3} |ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN" audit.log; then
              echo "npm audit reported findings"
              exit 1
            fi
            echo "npm audit endpoint unavailable (attempt $attempt of 4); retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "npm audit endpoint unavailable after 4 attempts"
          exit 1
